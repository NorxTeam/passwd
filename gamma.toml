schema = "gamma-recipe"
version = 2

[package]
name = "passwd"
version = "0.1.0"
license = "BSD-3-Clause"

[source]
kind = "git"
url = "https://github.com/shadow-maint/shadow.git"
baseline = "e4bd855661afe7c83ad2745d086a538398205225"
norx_scope = "norx/"

[provenance]
maintained_fork = "https://github.com/NorxTeam/passwd.git"

[build]
script = "norx/scripts/build.py"
targets = ["x86_64-unknown-norx", "aarch64-unknown-norx"]
dependencies = ["userdb", "userspace"]

[outputs]
files = [
  "tests/passwd/x86_64-unknown-norx/passwd-smoke.elf",
  "tests/passwd/aarch64-unknown-norx/passwd-smoke.elf",
  "var/lib/passwd/manifest.toml",
]
